name: Build and package

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        run: |
          dotnet publish src/TinyWinBuilder.App/TinyWinBuilder.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish/win-x64

      - name: Zip
        run: Compress-Archive -Path publish/win-x64/* -DestinationPath publish/TinyWinBuilder-win-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TinyWinBuilder-win-x64
          path: publish/TinyWinBuilder-win-x64.zip
